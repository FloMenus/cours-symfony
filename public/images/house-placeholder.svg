  <rect x="365" y="245" width="70" height="135" rx="4" fill="#d8a36b"/>

  <rect x="0" y="372" width="800" height="12" fill="#7aa85e"/>
  <circle cx="110" cy="345" r="32" fill="#74ae5c"/>
  <circle cx="145" cy="352" r="26" fill="#6aa653"/>
  <circle cx="690" cy="350" r="35" fill="#74ae5c"/>
  <circle cx="728" cy="356" r="26" fill="#6aa653"/>
