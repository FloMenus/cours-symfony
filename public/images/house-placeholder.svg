<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Maison moderne</title>
  <desc id="desc">Illustration generique d'une maison avec ciel et vegetation.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b7e3ff"/>
      <stop offset="100%" stop-color="#eef9ff"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b7d99f"/>
      <stop offset="100%" stop-color="#8fbe73"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <rect y="340" width="800" height="160" fill="url(#ground)"/>

  <circle cx="680" cy="92" r="44" fill="#ffd978"/>

